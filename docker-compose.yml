version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: ibs-db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Bind MySQL to localhost only for development to reduce remote exposure.
    # Change to "3306:3306" if you need external access from other machines.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./docker/mysql:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    container_name: ibs-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      # Use service name 'db' as the hostname inside the compose network
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: {}




